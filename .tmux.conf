# replace ctrl-b to ctrl-z
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# Splits
bind | split-window -h
bind - split-window -v

# Reload .tmux
bind r source-file ~/.tmux.conf \; display-message "tmux conf reloaded"

# Allow mouse
set -g mouse on
set -g focus-events on
set -g default-terminal "tmux-256color"
